# Better End Cities settings
#
# You never need to edit this file. Type /betterend in game for the settings
# menu, or /betterend setup for a guided tour. Changes made in game are saved
# back here. If you do edit it by hand, run /betterend reload afterwards.

database:
  # Where the plugin keeps your cities, elytra claims and everyone's loot.
  #   sqlite  a file on this server, no setup. Right for almost every server.
  #   mysql   a database server you run. Only needed when several servers
  #           share one End.
  # Takes effect after a restart. Switching starts from an empty database.
  type: sqlite
  # Only used when type is mysql.
  mysql:
    host: localhost
    port: 3306
    database: betterend
    username: root
    password: ""

discovery:
  # Register End Cities as players travel near them. A city works as soon as
  # it's found: loot, elytra frames and protection all switch on by themselves.
  # Off: no new cities are registered. Cities already found keep working.
  enabled: true
  # Also check the areas already loaded when the server starts. Off: a city in
  # one of those areas is missed until it loads again.
  startup-sweep: true
  # Worlds whose cities behave exactly like vanilla. Capital letters don't
  # matter. Example: [world_the_end_2, event_end]
  # Cities already registered in a world keep working until you remove them
  # with /betterend delete <id>.
  excluded-worlds: []

elytra:
  # Punching the ship's elytra frame gives the player an elytra, and the frame
  # keeps its elytra for the next player. Nobody can break the frame.
  # Off: the frame behaves like vanilla.
  enabled: true
  # How often a player can claim:
  #   per-ship     one elytra from each ship, ever
  #   per-refresh  again every time that city's loot comes back
  #   global       one elytra in total, across every ship
  claim-mode: per-ship
  cost:
    # The item a claim costs. Set it in game: /betterend, then Choose Cost
    # Item, then click an item in your inventory. Items from other plugins
    # work too. This stores the whole item, so editing it by hand won't work.
    item: ""
    # How many of that item a claim takes. 0 = no item.
    amount: 0
    # Experience levels a claim takes, on top of the item. 0 = none.
    levels: 0
    # Each elytra a player buys costs double the one before: 10 levels, then
    # 20, then 40. Each purchase stops counting once 'refresh-hours' (under
    # 'loot') has passed. Off: every elytra costs the same.
    double-each-claim: false
  # A floating note above the frame showing the cost, or "Punch to claim" when
  # it's free. Players can also right-click the frame to see their price.
  text-display: true
  # A faint shimmer of particles around the frame when a player is near.
  frame-aura: false

loot:
  # Each player who opens a city chest gets their own copy of what's inside,
  # so the first player through doesn't empty the city for everyone. Chests
  # players place themselves stay normal and shared.
  # Off: city chests behave like vanilla.
  enabled: true
  # Hours before a city's loot comes back. Each city counts down on its own,
  # starting when someone first loots it. The next player to open a chest
  # after that gets fresh loot for everyone.
  # 0 = never, so each player loots each chest once.
  refresh-hours: 12

protection:
  # Stop players breaking or building in cities. Every block of a tower, a
  # bridge or the ship is protected, whatever it is. The empty space between
  # towers stays free to build in. Staff with betterend.bypass.protection are
  # never stopped.
  enabled: true
  # What is protected:
  #   whole-city  every tower, bridge and the ship
  #   ship-only   only the ship and the city's loot chests. Pair it with
  #               'auto-reset-on-refresh' (under 'snapshot') so the towers are
  #               put back each time the loot comes back.
  scope: whole-city
  # Let players take the ship's dragon head once. Resetting the city never
  # puts a taken head back.
  dragon-head-takeable: false
  # How many blocks protection reaches past each tower's walls, to cover its
  # trim. 3 fits vanilla cities. Higher starts protecting empty space nearby.
  piece-padding: 3
  # Also stop players building inside a protected part of a city.
  block-place: true
  # Also protect cities from creepers, TNT and other explosions.
  block-explosions: true
  # Tell the player, just above their hotbar, why their break or build was
  # stopped.
  notify-denied: true

snapshot:
  # The most blocks one saved copy of a city may hold. Far above any real End
  # City; it only stops a broken structure from using up memory.
  max-cells: 3000000
  # Save a copy of each city when it's found, so /betterend reset always has
  # something to put back.
  auto-capture: true
  # Put a city's blocks back every time its loot comes back, undoing any
  # griefing. Players inside can be suffocated or pushed out, and anything
  # built there is erased. Turn it on if cities are only for farming; leave it
  # off if players build bases in them.
  auto-reset-on-refresh: false

# Anonymous usage counts (FastStats): which settings are in use, nothing about
# your players. Nothing is sent until the restart after the first start, so you
# can switch it off first. Takes effect after a restart.
# Off for every plugin at once: enabled=false in plugins/faststats/config.properties
metrics:
  enabled: true
  # Report this plugin's own errors automatically. IP addresses, file paths,
  # database passwords and player ids are removed first. Each report says the
  # plugin and Minecraft version, sqlite or mysql, whether it's Folia, roughly
  # how many cities you have, and what the plugin was doing. Other plugins'
  # errors, player names, chat, inventories and your world are never sent.
  # Off for every plugin at once: submitErrors=false in plugins/faststats/config.properties
  error-reporting: true

setup:
  # Set to true once the /betterend setup tour is finished or skipped. While
  # it's false, ops get a one-time reminder when they join.
  completed: false

debug:
  # Extra console logging for a bug report. Noisy: turn it on, make the problem
  # happen, then turn it off.
  verbose-logging: false
